name: merge-parts-and-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge parts into one zip
        run: |
          set -euo pipefail
          mkdir -p tmp
          # Eğer parçalar reponun kökünde ise bu satır uygundur:
          printf '%s\n' BMW_g20_Dom_part_* | sort > /tmp/parts_list
          echo "Parts to merge:"
          cat /tmp/parts_list
          echo "Merging..."
          > tmp/BMW_g20_Dom_v1.4_UNZIP.zip
          while IFS= read -r part; do
            cat "$part" >> tmp/BMW_g20_Dom_v1.4_UNZIP.zip
          done < /tmp/parts_list
          ls -lh tmp/BMW_g20_Dom_v1.4_UNZIP.zip

      - name: Verify zip integrity
        run: |
          unzip -tq tmp/BMW_g20_Dom_v1.4_UNZIP.zip || (echo "ZIP test failed" && exit 1)

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: merged-${{ github.run_id }}
          release_name: BMW_g20_Dom_v1.4
          draft: false
          prerelease: false

      - name: Upload merged zip as release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: tmp/BMW_g20_Dom_v1.4_UNZIP.zip
          asset_name: BMW_g20_Dom_v1.4_UNZIP.zip
          asset_content_type: application/zip

      - name: Done
        run: echo "Merged parts and uploaded release asset."
